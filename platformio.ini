; ROS-CAR ESP32-S3 下位机 —— 阶段二
;
; 开发流程（见 开发流程.md）：
;   通信采用自研工业级串口协议（附录「工业级串口帧标准结构」），不再使用 micro-ROS，
;   原 micro-ROS 里程碑代码已随本次提交移除。
;
; 当前阶段仅使用 Arduino 框架内置外设（GPIO / LEDC PWM / 外部中断 / Ticker / I2C），
; 无需任何第三方库 —— MPU6050 走 Wire 手写寄存器、姿态解算走自研互补滤波，
; 不引入 DMP 固件库。算法全在本仓库 lib/ 下，行为可读、可改、可查。
;
; 编译 / 烧录 / 串口监视：
;   pio run
;   pio run -t upload
;   pio device monitor -b 115200

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200   ; 与 main.cpp 中 Serial.begin(115200) 保持一致
upload_port = COM10      ; 板载 CH340 USB 串口（设备管理器里查看，换 USB 口后号码可能变化）
monitor_port = COM10
